<!DOCTYPE html>
<html>
<head>
    <title>Search Proxy Agent</title>
    <meta charset="UTF-8">
    <style>
        body{font-family:Arial;padding:20px;background:#f5f5f5}
        #status{padding:15px;background:#4CAF50;color:#fff;border-radius:8px;margin:10px 0;font-size:18px}
        #log{background:#fff;padding:15px;border:1px solid #ddd;height:500px;overflow-y:auto;border-radius:8px}
        .entry{padding:8px;border-bottom:1px solid #eee;font-family:monospace;font-size:12px}
        .success{color:#4CAF50} .error{color:#f44336} .info{color:#2196F3}
    </style>
</head>
<body>
    <h1>🤖 Distributed Search Agent</h1>
    <div id="status">Initializing...</div>
    <div id="log"></div>
    
    <script>
        const MASTER = 'https://elivateprogram.com/api/proxy-results';
        const ID = 'proxy-' + Math.random().toString(36).substr(2, 9);
        
        function log(msg, type = 'info') {
            const e = document.createElement('div');
            e.className = 'entry ' + type;
            e.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
            document.getElementById('log').prepend(e);
        }
        
        function status(msg, color) {
            const s = document.getElementById('status');
            s.textContent = msg;
            s.style.background = color || '#4CAF50';
        }
        
        async function poll() {
            try {
                const res = await fetch(MASTER + '/get-task?proxy_id=' + ID);
                if (res.status === 204) {
                    status('Waiting for tasks...', '#FFA500');
                    return;
                }
                if (res.ok) {
                    const task = await res.json();
                    if (task && task.keyword) {
                        log('Task: ' + task.keyword + ' ' + task.location, 'info');
                        await search(task);
                    }
                }
            } catch (err) {
                log('Poll error: ' + err.message, 'error');
                status('Connection error', '#f44336');
            }
        }
        
        async function search(task) {
            status('Searching: ' + task.keyword + ' ' + task.location, '#2196F3');
            
            const results = [];
            
            try {
                await fetch(MASTER + '/submit-results', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        task_id: task.task_id,
                        proxy_id: ID,
                        results: results,
                        completed_at: new Date().toISOString()
                    })
                });
                
                log('Submitted ' + results.length + ' results', 'success');
                status('Task complete', '#4CAF50');
            } catch (err) {
                log('Submit error: ' + err.message, 'error');
            }
        }
        
        log('Agent started: ' + ID, 'success');
        status('Agent active - polling every 5s', '#4CAF50');
        setInterval(poll, 5000);
        poll();
    </script>
</body>
</html>
